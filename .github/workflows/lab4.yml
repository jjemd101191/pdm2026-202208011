name: Lab 4 · Formato, análisis y pruebas

on:
  pull_request:
    paths:
      - "laboratorios/lab4/**"
      - ".github/workflows/lab4.yml"
  push:
    branches: [main]
    paths:
      - "laboratorios/lab4/**"
      - ".github/workflows/lab4.yml"

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "laboratorios/lab4"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test
